# XcodeGen spec. CI runs `xcodegen generate` to produce Redline.xcodeproj from this,
# so there is no Xcode project to maintain by hand.
# Reference: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md
name: Redline
options:
  deploymentTarget:
    iOS: "17.0"

packages:
  RedlineCore:
    path: Redline

targets:
  Redline:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: RedlineCore
        product: RedlineCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.redline
        PRODUCT_NAME: Redline
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "2" # iPad only
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Redline
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
