# XcodeGen spec. CI runs `xcodegen generate` to produce Redline.xcodeproj from this,
# so there is no Xcode project to maintain by hand.
# Reference: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md
name: Redline
options:
  deploymentTarget:
    iOS: "17.0"

packages:
  RedlineCore:
    path: Redline

targets:
  Redline:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: RedlineCore
        product: RedlineCore
    # XcodeGen writes this Info.plist at generate time (it is git-ignored).
    info:
      path: Redline-Info.plist
      properties:
        CFBundleDisplayName: Redline
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Expose the app's Documents folder (imported PDFs, exports) in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # "Open in Redline" for PDFs from Files / Mail / the share sheet.
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF document
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.redline
        PRODUCT_NAME: Redline
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "2" # iPad only
